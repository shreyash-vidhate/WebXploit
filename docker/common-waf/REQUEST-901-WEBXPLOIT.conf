# WebXploit local lab rules. IDs are reserved for this project.
SecRule REQUEST_URI "@beginsWith /ftp" "id:1000501,phase:1,deny,status:403,log,msg:'WebXploit A05: Exposed FTP directory blocked'"
SecRule REQUEST_URI "@beginsWith /backup/" "id:1000201,phase:1,deny,status:403,log,msg:'WebXploit A02: Sensitive backup path blocked'"
SecRule REQUEST_URI "@beginsWith /basket/validate" "id:1000401,phase:2,deny,status:403,log,msg:'WebXploit A04: Business-logic manipulation blocked',chain"
    SecRule ARGS:quantity "@rx ^-" "t:none"
SecRule ARGS:q "@rx (?:%0d|%0a|\\r|\\n)" "id:1000901,phase:2,deny,status:403,log,msg:'WebXploit A09: Log-injection control blocked'"
SecRule ARGS:url "@rx 169\\.254\\.169\\.254" "id:1001001,phase:2,deny,status:403,log,msg:'WebXploit A10: Cloud metadata probe blocked'"
